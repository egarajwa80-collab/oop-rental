name: Autograding Tests

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bagian 1 Main Output Test
        id: test-p01mainoutputtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 1 Main Output Test
          command: mvn -q test -Dtest=P01MainOutputTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Brand Test
        id: test-p02brandtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Brand Test
          command: mvn -q test -Dtest=P02BrandTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Car Test
        id: test-p02cartest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Car Test
          command: mvn -q test -Dtest=P02CarTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Encapsulation Test
        id: test-p03encapsulationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Encapsulation Test
          command: mvn -q test -Dtest=P03EncapsulationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Customer Test
        id: test-p03customertest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Customer Test
          command: mvn -q test -Dtest=P03CustomerTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Association Test
        id: test-p04associationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Association Test
          command: mvn -q test -Dtest=P04AssociationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Garage Aggregation Test
        id: test-p04garageaggregationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Garage Aggregation Test
          command: mvn -q test -Dtest=P04GarageAggregationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Composition Test
        id: test-p04customercardcompositiontest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Composition Test
          command: mvn -q test -Dtest=P04CustomerCardCompositionTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Dependency Test
        id: test-p04rentalagentdependencytest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Dependency Test
          command: mvn -q test -Dtest=P04RentalAgentDependencyTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 5 Inheritance Test
        id: test-p06inheritancetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 5 Inheritance Test
          command: mvn -q test -Dtest=P06InheritanceTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overriding Test
        id: test-p07overridetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overriding Test
          command: mvn -q test -Dtest=P07OverrideTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overloading Test
        id: test-p07overloadtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overloading Test
          command: mvn -q test -Dtest=P07OverloadTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 Rental Shop Test
        id: test-p08rentalshoptest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 Rental Shop Test
          command: mvn -q test -Dtest=P08RentalShopTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 Console App Test
        id: test-p08rentalapptest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 Console App Test
          command: mvn -q test -Dtest=P08RentalAppTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-P01MAINOUTPUTTEST_RESULTS: "${{ steps.test-p01mainoutputtest.outputs.result }}"
          TEST-P02BRANDTEST_RESULTS: "${{ steps.test-p02brandtest.outputs.result }}"
          TEST-P02CARTEST_RESULTS: "${{ steps.test-p02cartest.outputs.result }}"
          TEST-P03ENCAPSULATIONTEST_RESULTS: "${{ steps.test-p03encapsulationtest.outputs.result }}"
          TEST-P03CUSTOMERTEST_RESULTS: "${{ steps.test-p03customertest.outputs.result }}"
          TEST-P04ASSOCIATIONTEST_RESULTS: "${{ steps.test-p04associationtest.outputs.result }}"
          TEST-P04GARAGEAGGREGATIONTEST_RESULTS: "${{ steps.test-p04garageaggregationtest.outputs.result }}"
          TEST-P04CUSTOMERCARDCOMPOSITIONTEST_RESULTS: "${{ steps.test-p04customercardcompositiontest.outputs.result }}"
          TEST-P04RENTALAGENTDEPENDENCYTEST_RESULTS: "${{ steps.test-p04rentalagentdependencytest.outputs.result }}"
          TEST-P06INHERITANCETEST_RESULTS: "${{ steps.test-p06inheritancetest.outputs.result }}"
          TEST-P07OVERRIDETEST_RESULTS: "${{ steps.test-p07overridetest.outputs.result }}"
          TEST-P07OVERLOADTEST_RESULTS: "${{ steps.test-p07overloadtest.outputs.result }}"
          TEST-P08RENTALSHOPTEST_RESULTS: "${{ steps.test-p08rentalshoptest.outputs.result }}"
          TEST-P08RENTALAPPTEST_RESULTS: "${{ steps.test-p08rentalapptest.outputs.result }}"
        with:
          runners: test-p01mainoutputtest,test-p02brandtest,test-p02cartest,test-p03encapsulationtest,test-p03customertest,test-p04associationtest,test-p04garageaggregationtest,test-p04customercardcompositiontest,test-p04rentalagentdependencytest,test-p06inheritancetest,test-p07overridetest,test-p07overloadtest,test-p08rentalshoptest,test-p08rentalapptest
